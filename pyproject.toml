[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acdc-boundary-grid"
version = "0.1.0"
description = "Reproducible endogenous AC/DC boundary attribution study"
requires-python = ">=3.10"
dependencies = [
  "matplotlib==3.10.6",
  "networkx==3.4.2",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pandapower==3.4.0",
  "Pillow==11.3.0",
  "python-docx==1.2.0",
  "PyYAML==6.0.2",
  "scipy==1.15.3",
  "simbench==1.6.1",
]

[project.scripts]
acdc-boundary = "acdc_boundary.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
